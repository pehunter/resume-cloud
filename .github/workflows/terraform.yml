name: 'Terraform CI/CD'

on:
    push:
        branches:
            - master

env:
    TF_VERSION: '1.15.9'
    AWS_REGION: 'us-east-1'

jobs:
    terraform:
        name: 'Terraform'
        runs-on: ubuntu-latest
    
        steps:
          - name: 'Checkout'
            uses: actions/checkout@v4